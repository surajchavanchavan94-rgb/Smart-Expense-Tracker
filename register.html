<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1.0">

<title>Register - Smart Expense Tracker</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#111827,#2563eb);
}

.register-box{
    width:420px;
    background:white;
    padding:35px;
    border-radius:18px;
    box-shadow:0 20px 50px rgba(0,0,0,.25);
}

.logo{
    text-align:center;
    font-size:42px;
    margin-bottom:8px;
}

h1{
    text-align:center;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#6b7280;
    margin-bottom:25px;
}

label{
    display:block;
    margin-bottom:7px;
    font-weight:bold;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #cbd5e1;
    border-radius:8px;
    margin-bottom:17px;
    font-size:15px;
}

button{
    width:100%;
    padding:13px;
    border:0;
    border-radius:8px;
    background:#2563eb;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

.login{
    text-align:center;
    margin-top:20px;
}

.login a{
    color:#2563eb;
    text-decoration:none;
    font-weight:bold;
}

.flash{
    padding:12px;
    border-radius:8px;
    margin-bottom:15px;
    background:#fee2e2;
    color:#991b1b;
}

</style>

</head>


<body>


<div class="register-box">

    <div class="logo">
        📝
    </div>

    <h1>
        Create Account
    </h1>

    <p class="subtitle">
        Start tracking your expenses
    </p>


    {% with messages =
        get_flashed_messages(
            with_categories=true
        )
    %}

        {% if messages %}

            {% for category,message in messages %}

                <div class="flash">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}


    <form
        method="POST"
        action="{{ url_for('register') }}"
    >

        <label>
            Username
        </label>

        <input
            type="text"
            name="username"
            placeholder="Choose username"
            minlength="3"
            required
        >


        <label>
            Password
        </label>

        <input
            type="password"
            name="password"
            placeholder="Minimum 6 characters"
            minlength="6"
            required
        >


        <label>
            Confirm Password
        </label>

        <input
            type="password"
            name="confirm_password"
            placeholder="Repeat password"
            minlength="6"
            required
        >


        <button type="submit">
            🚀 Create Account
        </button>

    </form>


    <div class="login">

        Already have an account?

        <a href="{{ url_for('login') }}">
            Login
        </a>

    </div>

</div>


</body>

</html>
