<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Expense - Smart Expense Tracker</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: #f4f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 550px;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        h1 {
            color: #4f46e5;
            margin-bottom: 8px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #374151;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #4f46e5;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        button,
        .back-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
        }

        button {
            background: #4f46e5;
            color: white;
        }

        button:hover {
            background: #4338ca;
        }

        .back-btn {
            background: #e5e7eb;
            color: #374151;
        }

        .back-btn:hover {
            background: #d1d5db;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="box">

        <h1>✏️ Edit Expense</h1>

        <p class="subtitle">
            Update your expense details
        </p>

        <form
            method="POST"
            action="{{ url_for('edit_expense', expense_id=expense['id']) }}"
        >

            <!-- Expense Name -->

            <div class="form-group">

                <label for="name">
                    Expense Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    value="{{ expense['name'] or '' }}"
                    placeholder="Example: Lunch"
                    required
                >

            </div>


            <!-- Amount -->

            <div class="form-group">

                <label for="amount">
                    Amount (₹)
                </label>

                <input
                    type="number"
                    id="amount"
                    name="amount"
                    value="{{ expense['amount'] }}"
                    step="0.01"
                    min="0.01"
                    required
                >

            </div>


            <!-- Category -->

            <div class="form-group">

                <label for="category">
                    Category
                </label>

                <select
                    id="category"
                    name="category"
                    required
                >

                    {% for category in categories %}

                        <option
                            value="{{ category }}"
                            {% if expense['category'] == category %}
                                selected
                            {% endif %}
                        >
                            {{ category }}
                        </option>

                    {% endfor %}

                </select>

            </div>


            <!-- Description -->

            <div class="form-group">

                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    name="description"
                    placeholder="Optional description"
                >{{ expense['description'] or '' }}</textarea>

            </div>


            <!-- Date -->

            <div class="form-group">

                <label for="expense_date">
                    Date
                </label>

                <input
                    type="date"
                    id="expense_date"
                    name="expense_date"
                    value="{{ expense['expense_date'] }}"
                    required
                >

            </div>


            <!-- Buttons -->

            <div class="buttons">

                <a
                    href="{{ url_for('home') }}"
                    class="back-btn"
                >
                    ← Cancel
                </a>

                <button type="submit">
                    💾 Update Expense
                </button>

            </div>

        </form>

    </div>

</div>

</body>
</html>
